{% set name = "epicscorelibs" %}
{% set version = "7.0.10.99.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e8c8d9730faef7df55f4d329c359a0e4c044f03a524dd2e4587e90132873edfd
  patches:
    # Use the shared libraries from the epics-base package instead of building
    # and bundling a private copy, so both can coexist in one process.
    - patch/path_use_epics_base.patch
    # setup.py normally builds and bundles a private copy of the EPICS Base
    # DSOs/headers/dbd files (unused here, see path_use_epics_base.patch
    # above) using the setuptools_dso build framework, which also probes
    # the compiler toolchain (gcc/clang/msvc, and C++ ABI macros). Replace
    # all of this: this package builds no native code at all, so it no
    # longer needs setuptools_dso, or a compiler, at all.
    - patch/setup_no_setuptools_dso.patch
    # epicscorelibs.config exposes a small amount of toolchain information
    # (OS_CLASS, CMPLR_CLASS, CPPFLAGS, ...) as public API, determined
    # upstream by invoking a compiler's preprocessor (via setuptools_dso)
    # at import time. Since this is a noarch: python package installed
    # as-is on every platform, nothing can be baked in at build time
    # (unlike setup_no_setuptools_dso.patch, above, for the same reason).
    # Instead derive it from platform.system() at import time: a given
    # platform's compiler family and C++ ABI are fixed and coherent across
    # the whole conda-forge ecosystem, so this is equivalent to actually
    # probing a compiler, without requiring setuptools_dso or a compiler
    # to be present at all.
    - patch/config_noarch_no_probe.patch

build:
  number: 1
  noarch: python
  script: '{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv'

requirements:
  host:
    - python
    - pip
    - setuptools
    - epics-base
  run:
    - python
    - numpy
    - epics-base

test:
  imports:
    - epicscorelibs
    - epicscorelibs.ca.cadef  # loads libca from epics-base at import
    - epicscorelibs.ca.dbr
    - epicscorelibs.config
  commands:
    # EPICS libraries come from epics-base; none are bundled here
    - python -c "import os, epicscorelibs; d = os.path.join(os.path.dirname(epicscorelibs.__file__), 'lib'); assert not any(f.endswith(('.so', '.dylib', '.dll')) for f in os.listdir(d))"

about:
  home: https://github.com/mdavidsaver/epicscorelibs
  license: EPICS
  license_file: LICENSE
  summary: EPICS core libraries packaged as a "python" module
  description: |
    The EPICS (Experimental Physics and Industrial Control System) core
    libraries for use by python modules. Either dynamically with ctypes
    or statically by compiled extension.

extra:
  recipe-maintainers:
    - hhslepicka
    - klauer
    - mrakitin
