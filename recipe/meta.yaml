{% set name = "epicscorelibs" %}
{% set version = "7.0.10.99.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e8c8d9730faef7df55f4d329c359a0e4c044f03a524dd2e4587e90132873edfd
  patches:
    # Use the shared libraries from the epics-base package instead of building
    # and bundling a private copy, so both can coexist in one process.
    - patch/path_use_epics_base.patch
    # setup.py normally builds and bundles a private copy of the EPICS Base
    # DSOs/headers/dbd files (unused here, see path_use_epics_base.patch
    # above) using the setuptools_dso build framework, which also probes
    # the compiler toolchain (gcc/clang/msvc, and C++ ABI macros) to
    # generate epicscorelibs._config. Replace all of this: this package
    # builds no native code at all in this recipe, and conda-forge's
    # per-platform compiler family and C++ ABI are already fixed and
    # coherent ecosystem-wide, so epicscorelibs._config can be generated
    # directly instead of by invoking a compiler. This removes the need
    # for setuptools_dso entirely, at both build time and run time.
    - patch/setup_no_setuptools_dso.patch
    # epicscorelibs.config re-probes the compiler ID (gcc/clang/msvc) with
    # setuptools_dso every time it is imported, even though the same
    # information is already baked into the generated epicscorelibs._config
    # module at build time (alongside the cxxdefs ABI macros, see
    # setup_no_setuptools_dso.patch above). Reuse that instead.
    - patch/config_no_runtime_probe.patch

build:
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv'

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - python
    - pip
    - setuptools
    - epics-base
  run:
    - python
    - numpy
    - epics-base

test:
  imports:
    - epicscorelibs
    - epicscorelibs.ca.cadef  # loads libca from epics-base at import
    - epicscorelibs.ca.dbr
    - epicscorelibs.config
  commands:
    # EPICS libraries come from epics-base; none are bundled here
    - python -c "import os, epicscorelibs; d = os.path.join(os.path.dirname(epicscorelibs.__file__), 'lib'); assert not any(f.endswith(('.so', '.dylib', '.dll')) for f in os.listdir(d))"

about:
  home: https://github.com/mdavidsaver/epicscorelibs
  license: EPICS
  license_file: LICENSE
  summary: EPICS core libraries packaged as a "python" module
  description: |
    The EPICS (Experimental Physics and Industrial Control System) core
    libraries for use by python modules. Either dynamically with ctypes
    or statically by compiled extension.

extra:
  recipe-maintainers:
    - hhslepicka
    - klauer
    - mrakitin
